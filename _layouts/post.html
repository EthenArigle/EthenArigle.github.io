---
layout: default
---
<article class="article">
  <header class="article-header">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">← All writing</a>
    <p class="eyebrow">Research note</p>
    <h1>{{ page.title }}</h1>
    <p class="article-deck">{{ page.description }}</p>
    <div class="article-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time><span>{{ content | number_of_words | divided_by: 220 | plus: 1 }} min read</span></div>
  </header>
  <div class="prose">{{ content }}</div>
</article>
