<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fb">
    <script>try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="icon" href="{{ '/assets/images/og.png' | relative_url }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ '/assets/images/og.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% seo title=false %}
    <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <nav class="nav shell" aria-label="Primary navigation">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name }} — Home">
          <img src="{{ '/assets/images/wds-logo.png' | relative_url }}" alt="WDS">
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">Menu</button>
        <div class="nav-links" id="nav-links">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
          <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} aria-current="page"{% endif %}>Publications</a>
          <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog' %} aria-current="page"{% endif %}>Blog</a>
          <a href="{{ '/gallery/' | relative_url }}"{% if page.url contains '/gallery' %} aria-current="page"{% endif %}>Gallery</a>
          <a href="{{ '/cv/' | relative_url }}"{% if page.url contains '/cv' %} aria-current="page"{% endif %}>CV</a>
          <button class="theme-toggle" type="button" aria-label="Switch color theme"><span aria-hidden="true">◐</span></button>
        </div>
      </nav>
    </header>
    <main id="main-content" class="shell">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner"><p>© {{ 'now' | date: '%Y' }} {{ site.data.profile.name }}</p><p>Built with Jekyll · Hosted on GitHub Pages</p></div>
    </footer>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
